server:
  port: 8443

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:9000}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - PreserveHostHeader
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - PreserveHostHeader
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - PreserveHostHeader
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

security:
  jwt:
    secret: ${JWT_SECRET:MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId:-N/A}] %logger{36} - %msg%n"
  level:
    com.reto.gateway: INFO
    org.springframework.cloud.gateway: INFO
