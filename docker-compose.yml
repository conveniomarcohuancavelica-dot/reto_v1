version: "3.8"

networks:
  reto-net:
    driver: bridge

volumes:
  mysql-order-data:
  mysql-inventory-data:

services:

  # ---------------------------------------------------------------------
  # Base de datos de Order Service
  # ---------------------------------------------------------------------
  mysql-order:
    image: mysql:8.4
    container_name: mysql-order
    environment:
      MYSQL_DATABASE: orderdb
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql-order-data:/var/lib/mysql
    networks:
      - reto-net
    ports:
      # Host 3316 -> Contenedor 3306: se evita a propósito el puerto por
      # defecto en el host (3306), muy probablemente ocupado por una
      # instalación local de MySQL/XAMPP/WAMP en la máquina del desarrollador.
      - "3316:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------
  # Base de datos de Inventory Service
  # ---------------------------------------------------------------------
  mysql-inventory:
    image: mysql:8.4
    container_name: mysql-inventory
    environment:
      MYSQL_DATABASE: inventorydb
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql-inventory-data:/var/lib/mysql
    networks:
      - reto-net
    ports:
      # Host 3317 -> Contenedor 3306: mismo motivo que mysql-order, y
      # distinto del 3316 de arriba para que ambos convivan sin choque.
      - "3317:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------
  # Auth Service: emite JWT (HS256) - reemplaza a un Authorization Server
  # externo tipo Keycloak, manteniendo el mismo esquema OAuth2/JWT.
  # ---------------------------------------------------------------------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}
    networks:
      - reto-net
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------
  # Inventory Service
  # ---------------------------------------------------------------------
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-inventory:3306/inventorydb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: inventory_pass
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}
    depends_on:
      mysql-inventory:
        condition: service_healthy
    networks:
      - reto-net
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ---------------------------------------------------------------------
  # Order Service
  # ---------------------------------------------------------------------
  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-order:3306/orderdb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order_pass
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}
      INVENTORY_SERVICE_BASE_URL: http://inventory-service:8082
    depends_on:
      mysql-order:
        condition: service_healthy
      # Antes era "service_started" (solo esperaba a que el contenedor
      # arrancara, no a que Spring terminara de inicializar). Con el
      # Actuator agregado en inventory-service, ahora sí podemos esperar a
      # que esté realmente listo antes de levantar order-service.
      inventory-service:
        condition: service_healthy
    networks:
      - reto-net
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ---------------------------------------------------------------------
  # API Gateway (único punto público del sistema)
  # ---------------------------------------------------------------------
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}
      AUTH_SERVICE_URI: http://auth-service:9000
      ORDER_SERVICE_URI: http://order-service:8081
      INVENTORY_SERVICE_URI: http://inventory-service:8082
    depends_on:
      # Antes el Gateway solo esperaba a que los 3 contenedores arrancaran
      # (service_started), no a que sus apps de Spring estuvieran
      # realmente listas para recibir tráfico. Como los 4 servicios Java
      # ahora exponen /actuator/health, el Gateway espera hasta que estén
      # sanos de verdad antes de empezar a enrutar.
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - reto-net
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8443/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s
