version: "3.8"

networks:
  reto-net:
    driver: bridge

volumes:
  mysql-order-data:
  mysql-inventory-data:

services:

  # ---------------------------------------------------------------------
  # Base de datos de Order Service
  # ---------------------------------------------------------------------
  mysql-order:
    image: mysql:8.4
    container_name: mysql-order
    environment:
      MYSQL_DATABASE: orderdb
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql-order-data:/var/lib/mysql
    networks:
      - reto-net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------
  # Base de datos de Inventory Service
  # ---------------------------------------------------------------------
  mysql-inventory:
    image: mysql:8.4
    container_name: mysql-inventory
    environment:
      MYSQL_DATABASE: inventorydb
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql-inventory-data:/var/lib/mysql
    networks:
      - reto-net
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------
  # Auth Service: emite JWT (HS256) - reemplaza a un Authorization Server
  # externo tipo Keycloak, manteniendo el mismo esquema OAuth2/JWT.
  # ---------------------------------------------------------------------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}
    networks:
      - reto-net
    ports:
      - "9000:9000"

  # ---------------------------------------------------------------------
  # Inventory Service
  # ---------------------------------------------------------------------
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-inventory:3306/inventorydb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: inventory_pass
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}
    depends_on:
      mysql-inventory:
        condition: service_healthy
    networks:
      - reto-net
    ports:
      - "8082:8082"

  # ---------------------------------------------------------------------
  # Order Service
  # ---------------------------------------------------------------------
  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-order:3306/orderdb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order_pass
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}
      INVENTORY_SERVICE_BASE_URL: http://inventory-service:8082
    depends_on:
      mysql-order:
        condition: service_healthy
      inventory-service:
        condition: service_started
    networks:
      - reto-net
    ports:
      - "8081:8081"

  # ---------------------------------------------------------------------
  # API Gateway (único punto público del sistema)
  # ---------------------------------------------------------------------
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraParaElRetoTecnico2026ChangeMe}
      AUTH_SERVICE_URI: http://auth-service:9000
      ORDER_SERVICE_URI: http://order-service:8081
      INVENTORY_SERVICE_URI: http://inventory-service:8082
    depends_on:
      - auth-service
      - order-service
      - inventory-service
    networks:
      - reto-net
    ports:
      - "8443:8443"
