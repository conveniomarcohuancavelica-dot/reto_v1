$kind: http-request
name: 'Login - Usuario Admin'
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "admin",
      "password": "admin123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Token presente', () => pm.expect(json.accessToken).to.not.be.empty);
