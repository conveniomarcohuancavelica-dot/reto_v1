$kind: http-request
name: 'Login - Credenciales Inválidas (401)'
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "hacker",
      "password": "wrong"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Código INVALID_CREDENTIALS', () => {
        const json = pm.response.json();
        pm.expect(json.code).to.equal('INVALID_CREDENTIALS');
      });
